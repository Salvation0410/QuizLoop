<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizeloop 手机首页原型</title><style>
:root{--ink:#24232c;--cream:#fff8e8;--paper:#fffdf7;--coral:#ff725c;--sun:#ffd447;--sky:#9bdcff;--lime:#c7f36b;--pink:#ffb6d9;--muted:#77727a}*{box-sizing:border-box}body{margin:0;background:#dfefff;color:var(--ink);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif}.phone-shell{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--cream);padding:10px 16px 18px;box-shadow:0 0 0 1px #eadfc9}.status{height:23px;display:flex;justify-content:space-between;align-items:center;padding:0 3px;color:#6a6670;font:bold 11px Arial}.notch{width:78px;height:8px;border-radius:10px;background:#26252b;margin:-5px auto 9px}.appbar{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 10px}.hello{font-size:11px;color:#777}.hello b{display:block;color:var(--ink);font-size:15px;margin-top:3px}.wallet{background:var(--coral);color:#fff;border:2px solid var(--ink);padding:6px 9px;border-radius:15px;font-weight:900;font-size:12px;box-shadow:2px 2px 0 var(--ink)}.page-tags{display:flex;gap:6px;overflow-x:auto;padding:4px 0 11px;scrollbar-width:none}.page-tags::-webkit-scrollbar{display:none}.page-tags a{flex:1 0 0;text-align:center;white-space:nowrap;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--ink);padding:8px 7px;font-size:11px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}.page-tags a.active{background:var(--sun);transform:rotate(-2deg)}.hero{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}.hero h1{font:900 26px/1.12 Georgia,serif;margin:0;letter-spacing:-.4px}.avatar{width:47px;height:47px;border:3px solid var(--ink);border-radius:16px;background:var(--pink);display:grid;place-items:center;font-size:24px;transform:rotate(5deg);box-shadow:3px 3px 0 var(--ink)}.input-card{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:11px;box-shadow:3px 3px 0 var(--ink)}.input-card label{font-size:11px;font-weight:900;color:#7c7475}.prompt{margin-top:8px;border:2px dashed #d6c5ad;border-radius:11px;padding:11px;color:#9a8e85;font-size:12px;line-height:1.5;background:#fffaf1;min-height:67px}.start{width:65%;display:block;margin:11px auto 0;border:3px solid var(--ink);border-radius:13px;background:var(--coral);color:#fff;padding:10px;font-weight:900;box-shadow:3px 3px 0 var(--ink);cursor:pointer}.status-msg{text-align:center;min-height:16px;font-size:11px;color:var(--coral);font-weight:900;margin-top:7px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 8px}.section-title h2{font:900 16px Georgia,serif;margin:0}.section-title span{font-size:11px;color:var(--coral);font-weight:900}.cards{display:grid;gap:9px}.course{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:15px;padding:10px;box-shadow:2px 2px 0 var(--ink)}.course-icon{width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--sky);font-size:19px}.course:nth-child(2) .course-icon{background:var(--lime)}.course:nth-child(3) .course-icon{background:var(--pink)}.course h3{font-size:13px;margin:0 0 3px}.course p{font-size:10px;color:var(--muted);margin:0}.progress{margin-left:auto;width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--coral) 62%,#ebe9e1 0);font-size:10px;font-weight:900}.progress:after{content:"";position:absolute}.bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:18px;border:2px solid #eadfc9;background:#fff;padding:5px;border-radius:15px}.bottom-nav a{text-align:center;text-decoration:none;color:#8c8277;font-size:10px;padding:8px 3px;border-radius:10px}.bottom-nav a.active{color:var(--coral);background:#fff1e7;font-weight:900}.bottom-nav b{display:block;font-size:15px;margin-bottom:2px}.toast{display:none;background:var(--lime);border:2px solid var(--ink);padding:8px;font-size:11px;font-weight:900;margin-top:8px;text-align:center}.toast.show{display:block}@media(min-width:600px){body{padding:24px}.phone-shell{border:5px solid var(--ink);border-radius:32px;min-height:760px}}
</style></head><body><main class="phone-shell"><div class="status"><span>09:41</span><span>4G · 100% ◉</span></div><div class="notch"></div><div class="appbar"><div class="hello">今天也要好好学<b>你好，小皮</b></div><div class="wallet">602 🪙</div></div><nav class="page-tags" aria-label="页面切换"><a class="active" href="mobile-home.html">首页</a><a href="core-flow.html">闯关</a><a href="feature-extensions.html">学习库</a></nav><section class="hero"><h1>今天想闯哪一关？</h1><div class="avatar">☻</div></section><section class="input-card"><label>输入你想学的内容</label><div class="prompt">例如：RAG 和传统搜索有什么区别？<br>我想用简单的问答，快速搞懂它是怎么工作的。</div><button class="start" id="start">→ 开始生成题目</button><div class="status-msg" id="status"></div><div class="toast" id="toast">题目准备好啦，去闯关页看看！</div></section><div class="section-title"><h2>未完成关卡</h2><span>查看全部 →</span></div><section class="cards"><article class="course"><div class="course-icon">▲</div><div><h3>数学闯关</h3><p>20 道题 · 连胜 3 题</p></div><div class="progress">60%</div></article><article class="course"><div class="course-icon">⌂</div><div><h3>科学闯关</h3><p>20 道题 · 今天到期</p></div><div class="progress" style="background:conic-gradient(#63aaf4 40%,#ebe9e1 0)">40%</div></article><article class="course"><div class="course-icon">★</div><div><h3>产品设计</h3><p>10 道题 · 新关卡</p></div><div class="progress" style="background:conic-gradient(#9bcf51 18%,#ebe9e1 0)">18%</div></article></section><nav class="bottom-nav"><a class="active" href="mobile-home.html"><b>⌂</b>闯关</a><a href="feature-extensions.html"><b>▤</b>题库</a><a href="feature-extensions.html"><b>♢</b>勋章</a></nav></main><script>document.querySelector('#start').onclick=()=>{document.querySelector('#status').textContent='AI 正在整理知识点…';setTimeout(()=>document.querySelector('#toast').classList.add('show'),500)}</script></body></html>
