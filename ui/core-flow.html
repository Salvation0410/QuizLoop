<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizeloop 闯关</title><style>
:root{--ink:#24232c;--cream:#fff8e8;--coral:#ff725c;--sun:#ffd447;--sky:#9bdcff;--lime:#c7f36b;--pink:#ffb6d9;--muted:#77727a}*{box-sizing:border-box}body{margin:0;background:#dfefff;color:var(--ink);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif}.phone-shell{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--cream);padding:10px 16px 18px}.status{height:23px;display:flex;justify-content:space-between;color:#6a6670;font:bold 11px Arial}.notch{width:78px;height:8px;border-radius:10px;background:#26252b;margin:-5px auto 8px}.appbar{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}.hello{font-size:11px;color:var(--muted)}.hello b{display:block;color:var(--ink);font-size:15px;margin-top:3px}.wallet{background:var(--coral);color:white;border:2px solid var(--ink);padding:6px 9px;border-radius:15px;font-weight:900;font-size:12px;box-shadow:2px 2px 0 var(--ink)}.page-tags{display:flex;gap:6px;padding:5px 0 12px;overflow:auto;scrollbar-width:none}.page-tags::-webkit-scrollbar{display:none}.page-tags a{flex:1;text-align:center;white-space:nowrap;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--ink);padding:8px 7px;font-size:11px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}.page-tags a.active{background:var(--sun);transform:rotate(-2deg)}h1{font:900 26px/1.12 Georgia,serif;margin:7px 0 3px}.sub{font-size:12px;color:var(--muted);line-height:1.5}.panel{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px;margin-top:12px;box-shadow:3px 3px 0 var(--ink)}.progress-line{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.bar{height:9px;border:2px solid var(--ink);margin-top:7px}.bar i{display:block;width:40%;height:100%;background:var(--coral)}.speech{background:var(--pink);border:2px solid var(--ink);border-radius:13px;padding:10px;font-size:13px;font-weight:900;margin:13px 0;transform:rotate(-1deg)}.question h2{font:900 20px/1.25 Georgia,serif;margin:6px 0 13px}.meta{font-size:10px;color:#3479cf;font-weight:900}.opt{padding:11px;border:2px solid #bbb;margin-top:8px;font-size:12px;cursor:pointer}.opt.selected{border:3px solid var(--coral);background:#fff0ed;font-weight:900}.feedback{display:none;padding:10px;background:var(--lime);border:2px solid var(--ink);font-size:12px;line-height:1.45;margin-top:10px}.feedback.show{display:block}.actions{display:flex;gap:8px;margin-top:12px}button{flex:1;border:3px solid var(--ink);background:var(--coral);color:#fff;padding:10px;border-radius:12px;font-weight:900;box-shadow:3px 3px 0 var(--ink);cursor:pointer}.ghost{background:#fff;color:var(--ink)}.reward{display:flex;justify-content:space-between;align-items:center;background:#fff4d6;font-size:12px}.toast{display:none;margin-top:8px;padding:8px;background:var(--lime);border:2px solid var(--ink);font-size:11px;font-weight:900}.toast.show{display:block}.bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:17px;border:2px solid #eadfc9;background:#fff;padding:5px;border-radius:15px}.bottom-nav a{text-align:center;text-decoration:none;color:#8c8277;font-size:10px;padding:7px;border-radius:10px}.bottom-nav a.active{color:var(--coral);background:#fff1e7;font-weight:900}.bottom-nav b{display:block;font-size:15px}@media(min-width:600px){body{padding:24px}.phone-shell{border:5px solid var(--ink);border-radius:32px}}
</style></head><body><main class="phone-shell"><div class="status"><span>09:41</span><span>4G · 100% ◉</span></div><div class="notch"></div><div class="appbar"><div class="hello">今天继续闯关<b>你好，小皮</b></div><div class="wallet">602 🪙</div></div><nav class="page-tags"><a href="mobile-home.html">首页</a><a class="active" href="core-flow.html">闯关</a><a href="feature-extensions.html">学习库</a><a href="profile.html">我的</a></nav><h1>科学闯关 · 第 3 题</h1><p class="sub">答对就有金币，答错也会得到一段小讲解。</p><section class="panel"><div class="progress-line"><span>今日学习 · 2 分钟</span><span>03 / 10 · ⚡ 120 XP</span></div><div class="bar"><i></i></div><div class="speech" id="speech">哎呀，这题看起来有点“蓝”不住了！</div><div class="question"><div class="meta">单选题 · 光的散射</div><h2>天空为什么总在白天对我们“蓝脸”？</h2><div class="opt" data-correct="false">A · 红光比较害羞</div><div class="opt" data-correct="true">B · 蓝光更容易被散射</div><div class="opt" data-correct="false">C · 云朵偷偷染色</div><div class="feedback" id="feedback"></div></div><div class="actions"><button class="ghost" id="submit">提交答案</button><button id="next">下一题 →</button></div></section><section class="panel reward"><span>本题奖励</span><b>+12 金币 · 连胜 +1</b></section><div class="toast" id="toast">已进入下一题，继续把知识拿下！</div><nav class="bottom-nav"><a href="mobile-home.html"><b>⌂</b>首页</a><a class="active" href="core-flow.html"><b>★</b>闯关</a><a href="feature-extensions.html"><b>▤</b>学习库</a><a href="profile.html"><b>♢</b>我的</a></nav></main><script>let selected;document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected');selected=o});document.querySelector('#submit').onclick=()=>{const f=document.querySelector('#feedback');if(!selected){f.textContent='先选一个答案嘛，角色已经搬好小板凳等你了！';f.classList.add('show');return}const ok=selected.dataset.correct==='true';f.innerHTML=ok?'✓ 答对啦！蓝光波长短，更容易被空气分子散射。':'差一点点！正确答案是 B。蓝光更容易被散射。';f.style.background=ok?'var(--lime)':'#ffd9d5';f.classList.add('show');document.querySelector('#speech').textContent=ok?'稳稳拿下！这知识有点东西！':'没关系，知识正在偷偷长进！'};document.querySelector('#next').onclick=()=>document.querySelector('#toast').classList.add('show');</script></body></html>
