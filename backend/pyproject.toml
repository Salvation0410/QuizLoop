[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quizeloop-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.135,<1",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.1,<2",
  "pydantic-settings>=2.12,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live_llm: calls the configured CloseAI endpoint"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
